name: Build (one-off app, manual)

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: 'Short unique id for this app (used in filenames & release tags)'
        required: true
        type: string
      app_name:
        description: 'Human-readable app name (used in release titles/messages)'
        required: true
        type: string
      package_name:
        description: 'Android package name, e.g. com.google.android.youtube'
        required: true
        type: string
      apkmirror_org:
        description: 'APKMirror org slug, e.g. google-inc'
        required: true
        type: string
      apkmirror_app:
        description: 'APKMirror app slug, e.g. youtube'
        required: true
        type: string
      apkmirror_release_prefix:
        description: 'APKMirror release page URL prefix (optional; only needed if it differs from the app slug)'
        required: false
        type: string
      patches_repo:
        description: 'GitHub repo that publishes the patches bundle, e.g. MorpheApp/morphe-patches'
        required: true
        type: string
      patches_asset_regex:
        description: 'Regex to pick the patches asset (optional; uses config default if blank)'
        required: false
        type: string
      cli_repo:
        description: 'GitHub repo that publishes the Morphe CLI jar (optional; uses config default if blank)'
        required: false
        type: string
      cli_asset_regex:
        description: 'Regex to pick the CLI asset (optional; uses config default if blank)'
        required: false
        type: string
      version:
        description: 'Exact version to build (optional -- leave blank to auto-detect from patches)'
        required: false
        type: string
      force:
        description: 'Rebuild even if this version was already released'
        type: boolean
        default: false
      architectures:
        description: 'Architectures to build, comma-separated (optional; uses config default if blank)'
        required: false
        type: string
      dpi:
        description: 'Source DPI, e.g. 480 (optional; uses config default if blank)'
        required: false
        type: string
      build_mode:
        description: 'apk, module, or both (optional; uses config default if blank)'
        required: false
        type: string
      module_id:
        description: 'Module id (required when build_mode is module or both)'
        required: false
        type: string
      module_author:
        description: 'Module author (optional)'
        required: false
        type: string

permissions:
  id-token: write
  contents: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.app_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        env:
          DISABLE_MEDIA: true
          TZ: America/Los_Angeles
          LANG: en_US
        ports:
          - 8191:8191

    steps:
      - uses: actions/checkout@v4

      - name: Set up java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Wait for FlareSolverr to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8191/health > /dev/null; then
              echo "FlareSolverr is ready"
              exit 0
            fi
            sleep 2
          done
          echo "FlareSolverr did not become ready in time"
          exit 1

      - name: Generate one-off config.yml from inputs
        id: gen_config
        run: |
          {
            echo '# One-off config generated by the "Build (one-off app, manual)" workflow.'
            echo '# Blank optional inputs fall back to the defaults section below.'
            echo 'defaults:'
            echo '  architectures: ["universal"]'
            echo '  build_mode: "apk"'
            echo '  dpi: null'
            echo '  cli:'
            echo '    repo: "MorpheApp/morphe-desktop"'
            echo "    asset_regex: '^morphe-desktop-.*-all\\.jar$'"
            echo '    channel: "latest"'
            echo '  patches:'
            echo "    asset_regex: '^patches.*\\.(mpp|rvp)$'"
            echo '    channel: "latest"'
            echo ''
            echo 'apps:'
            echo "  - id: \"${APP_ID}\""
            echo '    enabled: true'
            echo "    name: \"${APP_NAME}\""
            echo "    package_name: \"${PACKAGE_NAME}\""
            echo '    apkmirror:'
            echo "      org: \"${APKMIRROR_ORG}\""
            echo "      app: \"${APKMIRROR_APP}\""
            echo '    patches:'
            echo "      repo: \"${PATCHES_REPO}\""
          } > /tmp/oneoff-config.yml

          if [ -n "${VERSION}" ]; then
            echo "              version: \"${VERSION}\"" >> /tmp/oneoff-config.yml
          fi

          if [ -n "${APKMIRROR_RELEASE_PREFIX}" ]; then
            echo "                release_prefix: \"${APKMIRROR_RELEASE_PREFIX}\"" >> /tmp/oneoff-config.yml
          fi

          if [ -n "${PATCHES_ASSET_REGEX}" ]; then
            echo "                asset_regex: \"${PATCHES_ASSET_REGEX}\"" >> /tmp/oneoff-config.yml
          fi

          if [ -n "${CLI_REPO}" ]; then
            echo "              cli:" >> /tmp/oneoff-config.yml
            echo "                repo: \"${CLI_REPO}\"" >> /tmp/oneoff-config.yml
            if [ -n "${CLI_ASSET_REGEX}" ]; then
              echo "                asset_regex: \"${CLI_ASSET_REGEX}\"" >> /tmp/oneoff-config.yml
            fi
          fi

          if [ -n "${BUILD_MODE}" ]; then
            echo "              build_mode: \"${BUILD_MODE}\"" >> /tmp/oneoff-config.yml
          else
            echo "              build_mode: \"apk\"" >> /tmp/oneoff-config.yml
          fi

          if [ -n "${ARCHITECTURES}" ]; then
            archs=$(echo "${ARCHITECTURES}" | sed 's/,/","/g; s/ //g')
            echo "              architectures: [\"${archs}\"]" >> /tmp/oneoff-config.yml
          else
            echo "              architectures: [\"universal\"]" >> /tmp/oneoff-config.yml
          fi

          if [ -n "${DPI}" ]; then
            echo "              dpi: ${DPI}" >> /tmp/oneoff-config.yml
          else
            echo "              dpi: null" >> /tmp/oneoff-config.yml
          fi

          if [ -n "${MODULE_ID}" ]; then
            echo "              module:" >> /tmp/oneoff-config.yml
            echo "                id: \"${MODULE_ID}\"" >> /tmp/oneoff-config.yml
            echo "                author: \"${MODULE_AUTHOR:-Morphe Multi-App Builder}\"" >> /tmp/oneoff-config.yml
          fi

          echo "              include_patches: []" >> /tmp/oneoff-config.yml
          echo "              exclude_patches: []" >> /tmp/oneoff-config.yml

          echo "--- Generated config ---"
          cat /tmp/oneoff-config.yml
          echo "--- End config ---"
        env:
          APP_ID: ${{ inputs.app_id }}
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          APKMIRROR_ORG: ${{ inputs.apkmirror_org }}
          APKMIRROR_APP: ${{ inputs.apkmirror_app }}
          APKMIRROR_RELEASE_PREFIX: ${{ inputs.apkmirror_release_prefix }}
          PATCHES_REPO: ${{ inputs.patches_repo }}
          PATCHES_ASSET_REGEX: ${{ inputs.patches_asset_regex }}
          CLI_REPO: ${{ inputs.cli_repo }}
          CLI_ASSET_REGEX: ${{ inputs.cli_asset_regex }}
          VERSION: ${{ inputs.version }}
          BUILD_MODE: ${{ inputs.build_mode }}
          ARCHITECTURES: ${{ inputs.architectures }}
          DPI: ${{ inputs.dpi }}
          MODULE_ID: ${{ inputs.module_id }}
          MODULE_AUTHOR: ${{ inputs.module_author }}

      - name: Validate config.yml
        run: uv run main.py --check --config /tmp/oneoff-config.yml

      - name: Build + publish the one-off app
        id: try_building
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          FLARESOLVERR_URL: http://localhost:8191
        run: |
          args=(--app "${{ inputs.app_id }}" --config /tmp/oneoff-config.yml)
          if [ -n "${{ inputs.version }}" ]; then
            args+=(--version "${{ inputs.version }}")
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            args+=(--force)
          fi
          uv run main.py "${args[@]}"

      - name: Generate Attestations
        if: steps.try_building.outputs.has_output == 'true'
        uses: actions/attest@v4.2.0
        with:
          subject-path: |
            ./output/**/*.apk
            ./output/**/*.zip
