name: Build (one-off app, manual)

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: 'Short unique id for this app (used in filenames & release tags)'
        required: true
        type: string
      app_name:
        description: 'Human-readable app name (used in release titles/messages)'
        required: true
        type: string
      package_name:
        description: 'Android package name, e.g. com.google.android.youtube'
        required: true
        type: string
      apkmirror_org:
        description: 'APKMirror org slug, e.g. google-inc'
        required: true
        type: string
      apkmirror_app:
        description: 'APKMirror app slug, e.g. youtube'
        required: true
        type: string
      apkmirror_release_prefix:
        description: 'APKMirror release page URL prefix (optional; only needed if it differs from the app slug)'
        required: false
        type: string
      patches_repo:
        description: 'GitHub repo that publishes the patches bundle, e.g. MorpheApp/morphe-patches'
        required: true
        type: string
      patches_asset_regex:
        description: 'Regex to pick the patches asset (optional; uses config default if blank)'
        required: false
        type: string
      cli_repo:
        description: 'GitHub repo that publishes the Morphe CLI jar (optional; uses config default if blank)'
        required: false
        type: string
      cli_asset_regex:
        description: 'Regex to pick the CLI asset (optional; uses config default if blank)'
        required: false
        type: string
      version:
        description: 'Exact version to build (optional -- leave blank to auto-detect from patches)'
        required: false
        type: string
      force:
        description: 'Rebuild even if this version was already released'
        type: boolean
        default: false
      architectures:
        description: 'Architectures to build, comma-separated (optional; uses config default if blank)'
        required: false
        type: string
      dpi:
        description: 'Source DPI, e.g. 480 (optional; uses config default if blank)'
        required: false
        type: string
      build_mode:
        description: 'apk, module, or both (optional; uses config default if blank)'
        required: false
        type: string
      module_id:
        description: 'Module id (required when build_mode is module or both)'
        required: false
        type: string
      module_author:
        description: 'Module author (optional)'
        required: false
        type: string

permissions:
  id-token: write
  contents: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.app_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        env:
          DISABLE_MEDIA: true
          TZ: America/Los_Angeles
          LANG: en_US
        ports:
          - 8191:8191

    steps:
      - uses: actions/checkout@v4

      - name: Set up java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Wait for FlareSolverr to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8191/health > /dev/null; then
              echo "FlareSolverr is ready"
              exit 0
            fi
            sleep 2
          done
          echo "FlareSolverr did not become ready in time"
          exit 1

      - name: Generate one-off config.yml from inputs
        id: gen_config
        run: |
          cat > /tmp/oneoff-config.yml <<'YAMLEOF'
          # One-off config generated by the "Build (one-off app, manual)" workflow.
          # Blank optional inputs fall back to the defaults section below.
          defaults:
            architectures: ["universal"]
            build_mode: "apk"
            dpi: null
            cli:
              repo: "MorpheApp/morphe-desktop"
              asset_regex: '^morphe-desktop-.*-all\.jar$'
              channel: "latest"
            patches:
              asset_regex: '^patches.*\.(mpp|rvp)$'
              channel: "latest"

          apps:
            - id: "${{ inputs.app_id }}"
              enabled: true
              name: "${{ inputs.app_name }}"
              package_name: "${{ inputs.package_name }}"
              ${{ inputs.version && format('version: "{0}"', inputs.version) || '' }}
              apkmirror:
                org: "${{ inputs.apkmirror_org }}"
                app: "${{ inputs.apkmirror_app }}"
                ${{ inputs.apkmirror_release_prefix && format('release_prefix: "{0}"', inputs.apkmirror_release_prefix) || '' }}
              patches:
                repo: "${{ inputs.patches_repo }}"
                ${{ inputs.patches_asset_regex && format('asset_regex: "{0}"', inputs.patches_asset_regex) || '' }}
          YAMLEOF

          if [ -n "${{ inputs.cli_repo }}" ]; then
            cat >> /tmp/oneoff-config.yml <<YAMLEOF
              cli:
                repo: "${{ inputs.cli_repo }}"
                ${{ inputs.cli_asset_regex && format('asset_regex: "{0}"', inputs.cli_asset_regex) || '' }}
YAMLEOF
          fi

          if [ -n "${{ inputs.build_mode }}" ]; then
            echo "              build_mode: \"${{ inputs.build_mode }}\"" >> /tmp/oneoff-config.yml
          else
            echo "              build_mode: \"apk\"" >> /tmp/oneoff-config.yml
          fi

          if [ -n "${{ inputs.architectures }}" ]; then
            archs=$(echo "${{ inputs.architectures }}" | sed 's/,/","/g; s/ //g')
            echo "              architectures: [\"${archs}\"]" >> /tmp/oneoff-config.yml
          else
            echo "              architectures: [\"universal\"]" >> /tmp/oneoff-config.yml
          fi

          if [ -n "${{ inputs.dpi }}" ]; then
            echo "              dpi: ${{ inputs.dpi }}" >> /tmp/oneoff-config.yml
          else
            echo "              dpi: null" >> /tmp/oneoff-config.yml
          fi

          if [ -n "${{ inputs.module_id }}" ]; then
            echo "              module:" >> /tmp/oneoff-config.yml
            echo "                id: \"${{ inputs.module_id }}\"" >> /tmp/oneoff-config.yml
            echo "                author: \"${{ inputs.module_author || 'Morphe Multi-App Builder' }}\"" >> /tmp/oneoff-config.yml
          fi

          echo "              include_patches: []" >> /tmp/oneoff-config.yml
          echo "              exclude_patches: []" >> /tmp/oneoff-config.yml

          echo "--- Generated config ---"
          cat /tmp/oneoff-config.yml
          echo "--- End config ---"

      - name: Validate config.yml
        run: uv run main.py --check --config /tmp/oneoff-config.yml

      - name: Build + publish the one-off app
        id: try_building
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          FLARESOLVERR_URL: http://localhost:8191
        run: |
          args=(--app "${{ inputs.app_id }}" --config /tmp/oneoff-config.yml)
          if [ -n "${{ inputs.version }}" ]; then
            args+=(--version "${{ inputs.version }}")
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            args+=(--force)
          fi
          uv run main.py "${args[@]}"

      - name: Generate Attestations
        if: steps.try_building.outputs.has_output == 'true'
        uses: actions/attest@v4.2.0
        with:
          subject-path: |
            ./output/**/*.apk
            ./output/**/*.zip
