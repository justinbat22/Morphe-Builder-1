name: Build (one-off app, manual)

# Use this for a one-time build of an app you do NOT want in config.yml.
# Fill in the required fields; leave anything optional blank to inherit this
# repo's own config.yml defaults. Nothing here is saved or scheduled -- it is
# a single manual run.

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: 'Short unique id for this app (lowercase letters/numbers/_/- only; used in filenames & release tags)'
        required: true
        type: string
      app_name:
        description: 'Human-readable app name (used in release titles/messages)'
        required: true
        type: string
      package_name:
        description: 'Android package name, e.g. com.google.android.youtube'
        required: true
        type: string
      apkmirror_org:
        description: 'APKMirror org slug, e.g. google-inc'
        required: true
        type: string
      apkmirror_app:
        description: 'APKMirror app slug, e.g. youtube'
        required: true
        type: string
      patches_repo:
        description: 'GitHub repo that publishes the patches bundle, e.g. MorpheApp/morphe-patches'
        required: true
        type: string

      apkmirror_release_prefix:
        description: 'APKMirror release-page URL prefix (optional; only if it differs from the app slug, e.g. instagram)'
        required: false
        type: string
      patches_asset_regex:
        description: 'Regex to pick the patches asset (optional; uses config.yml default if blank)'
        required: false
        type: string
      cli_repo:
        description: 'GitHub repo publishing the Morphe CLI jar (optional; uses config.yml default if blank)'
        required: false
        type: string
      cli_asset_regex:
        description: 'Regex to pick the CLI asset (optional; uses config.yml default if blank)'
        required: false
        type: string
      version:
        description: 'Exact version to build (optional; leave blank to auto-detect from the patches)'
        required: false
        type: string
      architectures:
        description: 'Architectures, comma-separated, e.g. arm64-v8a,universal (optional; uses config.yml default if blank)'
        required: false
        type: string
      dpi:
        description: 'Source DPI, e.g. 480, anydpi or nodpi (optional; uses config.yml default if blank)'
        required: false
        type: string
      build_mode:
        description: 'apk, module, or both (optional; uses config.yml default if blank)'
        required: false
        type: string
      module_id:
        description: 'Root module id (only for build_mode module/both)'
        required: false
        type: string
      module_author:
        description: 'Root module author (optional)'
        required: false
        type: string
      force:
        description: 'Rebuild even if this version was already released'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.app_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        env:
          DISABLE_MEDIA: true
          TZ: America/Los_Angeles
          LANG: en_US
        ports:
          - 8191:8191

    steps:
      - uses: actions/checkout@v4

      - name: Set up java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Wait for FlareSolverr to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8191/health > /dev/null; then
              echo "FlareSolverr is ready"
              exit 0
            fi
            sleep 2
          done
          echo "FlareSolverr did not become ready in time"
          exit 1

      - name: Generate one-off config from inputs
        env:
          APP_ID: ${{ inputs.app_id }}
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          APKMIRROR_ORG: ${{ inputs.apkmirror_org }}
          APKMIRROR_APP: ${{ inputs.apkmirror_app }}
          APKMIRROR_RELEASE_PREFIX: ${{ inputs.apkmirror_release_prefix }}
          PATCHES_REPO: ${{ inputs.patches_repo }}
          PATCHES_ASSET_REGEX: ${{ inputs.patches_asset_regex }}
          CLI_REPO: ${{ inputs.cli_repo }}
          CLI_ASSET_REGEX: ${{ inputs.cli_asset_regex }}
          VERSION: ${{ inputs.version }}
          ARCHITECTURES: ${{ inputs.architectures }}
          DPI: ${{ inputs.dpi }}
          BUILD_MODE: ${{ inputs.build_mode }}
          MODULE_ID: ${{ inputs.module_id }}
          MODULE_AUTHOR: ${{ inputs.module_author }}
        run: uv run python oneoff_config.py --base config.yml --out /tmp/oneoff-config.yml

      - name: Validate the generated config
        run: uv run main.py --check --config /tmp/oneoff-config.yml

      - name: Build + publish the one-off app
        id: try_building
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          FLARESOLVERR_URL: http://localhost:8191
        run: |
          args=(--app "${{ inputs.app_id }}" --config /tmp/oneoff-config.yml)
          if [ -n "${{ inputs.version }}" ]; then
            args+=(--version "${{ inputs.version }}")
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            args+=(--force)
          fi
          uv run main.py "${args[@]}"

      - name: Generate Attestations
        if: steps.try_building.outputs.has_output == 'true'
        uses: actions/attest@v4.2.0
        with:
          subject-path: |
            ./output/**/*.apk
            ./output/**/*.zip
